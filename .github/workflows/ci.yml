name: ScanBridge Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    name: Offline PowerShell ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Verify module and offline synthetic tests
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/Test-Repo.ps1
          if (-not $?) { throw 'ScanBridge test suite failed.' }
